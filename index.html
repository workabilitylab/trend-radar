<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workability Lab :: Trend Radar</title>
<link rel="icon" href="favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#2E2BFF;--ink:#0B0B0B;--paper:#FFFFFF;--line:#111111;--hair:#E6E6E6;--muted:#6B7280;
    --mono:"Space Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 40px;width:100%;}
  @media(max-width:640px){.wrap{padding:0 20px;}}

  header.site{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:40;}
  .hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px;}
  .brand{justify-self:start;display:flex;align-items:center;cursor:pointer;}
  .brand-logo{height:30px;width:auto;display:block;}
  nav.center{justify-self:center;display:flex;gap:38px;}
  nav.center a{font-family:var(--mono);font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink);padding:6px 0;border-bottom:2px solid transparent;cursor:pointer;transition:.15s;}
  nav.center a:hover{color:var(--blue);}
  nav.center a.active{border-color:var(--blue);color:var(--blue);}
  .hdr-right{justify-self:end;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  @media(max-width:720px){nav.center{gap:20px;} .hdr-right{display:none;} .hdr{grid-template-columns:1fr auto;}}

  .hero{padding:54px 0 30px;border-bottom:1px solid var(--hair);}
  .eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:18px;}
  .hero h1{font-size:48px;line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:0 0 16px;max-width:16ch;}
  .hero p{font-size:17px;color:var(--muted);max-width:64ch;margin:0;}
  @media(max-width:640px){.hero h1{font-size:32px;}}

  .filterbar{position:sticky;top:76px;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--hair);}
  .filterbar .inner{padding-top:16px;padding-bottom:14px;}
  .search{width:100%;border:1px solid var(--line);background:#fff;padding:13px 15px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;outline:none;color:var(--ink);margin-bottom:14px;}
  .search::placeholder{color:#9CA3AF;}
  .search:focus{border-color:var(--blue);}
  .chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:#fff;border:1px solid var(--hair);padding:8px 12px;cursor:pointer;transition:.12s;}
  .chip:hover{border-color:var(--steep,#111);}
  .chip i{width:11px;height:11px;border-radius:2px;display:inline-block;background:var(--steep,#111);}
  .chip .n{color:var(--muted);}
  .chip.on{color:#fff;background:var(--steep,#111);border-color:var(--steep,#111);}
  .chip.on .n{color:rgba(255,255,255,.8);}
  .chip.on.econ{color:var(--ink);}
  .chip.on.econ .n{color:rgba(0,0,0,.55);}
  .chip.all i{background:linear-gradient(90deg,#E4572E,#E0A100,#128A4B,#2E2BFF,#7B2FF7);}
  .chip.all.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip.all.on i{opacity:1;}

  #feed,#boards,#boarddetail,#allsig{padding-bottom:60px;}
  .day{padding:0 0 8px;}
  .day-rule{height:6px;background:var(--blue);margin:0 0 30px;}
  .day:first-of-type .day-rule{display:none;}
  .day-head{padding:42px 0 4px;}
  .day-date{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0 0 10px;}
  .day-meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
  .day-intro{font-size:16px;color:var(--muted);line-height:1.6;max-width:78ch;margin:0 0 8px;}
  @media(max-width:640px){.day-date{font-size:38px;}}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:24px 0 20px;align-items:stretch;grid-auto-rows:1fr;}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}

  .fcard{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;overflow:hidden;transition:.15s;position:relative;height:100%;cursor:pointer;}
  .fcard:hover{border-color:var(--steep);transform:translateY(-2px);}
  .fcard:hover h4{color:var(--steep);}
  .fcard .bar{height:6px;background:var(--steep);flex:0 0 auto;}
  .fcard .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f2f2f7;border-bottom:1px solid var(--hair);}
  .fcard .inner{padding:20px 20px 18px;display:flex;flex-direction:column;flex:1;}
  .steep-tag{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--steep);padding:4px 10px;margin-bottom:14px;}
  .steep-tag.dark{color:var(--ink);}
  .fcard h4{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.22;margin:0 0 10px;transition:.15s;display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .fcard .kick{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
  .fcard .body{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:6;line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .fcard .foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .src{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);padding:8px 13px;transition:.12s;max-width:100%;}
  .src span{overflow:hidden;text-overflow:ellipsis;}
  .src .arw{flex:0 0 auto;}
  .fcard:hover .src{border-color:var(--steep);}
  .src:hover{background:var(--steep);color:#fff;}

  /* Save-to-board button */
  .save{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid var(--hair);padding:8px 12px;cursor:pointer;transition:.12s;}
  .save:hover{border-color:var(--steep,#2E2BFF);color:var(--steep,#2E2BFF);}
  .save.on{border-color:var(--steep,#2E2BFF);background:var(--steep,#2E2BFF);color:#fff;}
  .save.on.econ{color:var(--ink);}
  .save .cnt{opacity:.85;}
  .sig-remove{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--hair);padding:8px 12px;cursor:pointer;transition:.12s;}
  .sig-remove:hover{border-color:#D11;color:#D11;}
  .foot-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sig-dl{width:38px;height:38px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hair);background:#fff;cursor:pointer;transition:.12s;color:var(--muted);}
  .sig-dl:hover{border-color:var(--blue);color:var(--blue);}
  .sig-dl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  .empty{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:60px 0;text-align:center;}
  .empty .btn{margin-top:18px;}

  /* page heads */
  .page-head{padding:30px 0 20px;border-bottom:1px solid var(--hair);margin-bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .page-title{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px;line-height:1;}
  .page-sub{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .back{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:var(--muted);margin:30px 0 4px;padding:0;}
  .back:hover{color:var(--blue);}

  /* generic button */
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:11px 16px;cursor:pointer;transition:.12s;}
  .btn:hover{background:var(--blue);border-color:var(--blue);}
  .btn.ghost{background:#fff;color:var(--ink);}
  .btn.ghost:hover{background:#fff;color:var(--blue);border-color:var(--blue);}
  .btn.danger:hover{background:#D11;border-color:#D11;color:#fff;}

  /* Boards grid */
  .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:26px 0 20px;}
  @media(max-width:900px){.bgrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.bgrid{grid-template-columns:1fr;}}
  .bcard{cursor:pointer;display:flex;flex-direction:column;position:relative;border:1px solid var(--line);background:#fff;overflow:hidden;transition:.15s;}
  .bcard:hover{border-color:var(--blue);transform:translateY(-2px);}
  .bedit{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.95);border:1px solid var(--line);color:var(--ink);padding:7px 10px;cursor:pointer;opacity:0;transform:translateY(-4px);transition:.14s;}
  .bcard:hover .bedit{opacity:1;transform:none;}
  .bedit:hover{background:var(--blue);border-color:var(--blue);color:#fff;}
  .bedit svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bcard .cover{aspect-ratio:4/3;width:100%;border-bottom:1px solid var(--hair);background:#f2f2f7;object-fit:cover;display:block;}
  .bcard .cover-ph{aspect-ratio:4/3;width:100%;border-bottom:1px solid var(--hair);background:linear-gradient(135deg,#ececff,#f6f6f6);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:34px;font-weight:700;color:var(--blue);}
  .bcard .binner{padding:14px 16px 16px;}
  .bcard .bname{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;}
  .bcard .bmeta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .bcard .bdesc{font-size:13.5px;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* Save popover */
  .picker{position:absolute;z-index:120;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.18);padding:16px;}
  .picker h5{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;text-align:center;}
  .picker .psearch{width:100%;border:1px solid var(--hair);padding:10px 12px;font-family:var(--sans);font-size:14px;outline:none;margin-bottom:12px;}
  .picker .psearch:focus{border-color:var(--blue);}
  .picker .plist{max-height:240px;overflow:auto;margin:0 -4px;}
  .prow{display:flex;align-items:center;gap:12px;padding:9px 8px;cursor:pointer;border-radius:6px;}
  .prow:hover{background:#f5f5ff;}
  .prow .pthumb{width:44px;height:44px;flex:0 0 auto;object-fit:cover;background:#eee;border:1px solid var(--hair);}
  .prow .pthumb-ph{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#ececff;border:1px solid var(--hair);font-family:var(--mono);font-weight:700;color:var(--blue);}
  .prow .pinfo{flex:1;min-width:0;}
  .prow .pn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prow .pc{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .prow .pcheck{width:22px;height:22px;flex:0 0 auto;border:1.5px solid var(--hair);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .prow.checked .pcheck{background:var(--blue);border-color:var(--blue);}
  .picker .pcreate{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);}
  .picker .pcreate input{flex:1;border:1px solid var(--hair);padding:9px 11px;font-family:var(--sans);font-size:14px;outline:none;}
  .picker .pcreate input:focus{border-color:var(--blue);}
  .picker .pcreate button{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:0 14px;cursor:pointer;}
  .picker .pcreate button:hover{background:var(--blue);}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border:1px solid var(--line);width:520px;max-width:100%;max-height:88vh;overflow:auto;padding:26px;}
  .modal h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 18px;}
  .modal label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .modal input[type=text],.modal textarea{width:100%;border:1px solid var(--hair);padding:11px 13px;font-family:var(--sans);font-size:15px;outline:none;margin-bottom:18px;}
  .modal input[type=text]:focus,.modal textarea:focus{border-color:var(--blue);}
  .modal textarea{min-height:80px;resize:vertical;}
  .modal .cover-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:18px;max-height:220px;overflow:auto;align-items:start;}
  .modal .cover-opt{height:72px;width:100%;object-fit:cover;border:2px solid transparent;cursor:pointer;background:#eee;display:block;}
  .modal .cover-opt.sel{border-color:var(--blue);}
  .modal .cover-none{height:72px;border:2px dashed var(--hair);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:6px;}
  .modal-actions .spacer{flex:1;}

  footer.site{margin-top:auto;background:var(--ink);color:#fff;}
  .site-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-top:22px;padding-bottom:22px;}
  .site-foot .copy{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:#fff;}
  .site-foot .conf{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-align:center;color:#fff;}
  .site-foot .logos{display:flex;align-items:center;justify-content:flex-end;gap:28px;}
  .dell-img{height:20px;width:auto;display:block;}
  .eldorado-img{height:34px;width:auto;display:block;}
  @media(max-width:760px){.site-foot{grid-template-columns:1fr;text-align:center;gap:18px;}.site-foot .conf{text-align:center;}.site-foot .logos{justify-content:center;}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap hdr">
    <div class="brand" onclick="showView('ed')"><img class="brand-logo" src="workability-logo.png" alt="Workability Lab" /></div>
    <nav class="center">
      <a id="nav-ed" class="active" onclick="showView('ed')">Editions</a>
      <a id="nav-boards" onclick="showView('boards')">Boards <span id="boards-count" class="page-sub" style="text-transform:none;letter-spacing:0"></span></a>
      <a id="nav-allsig" onclick="showView('allsig')">All Signals <span id="allsig-count" class="page-sub" style="text-transform:none;letter-spacing:0"></span></a>
    </nav>
    <div class="hdr-right">EN Edition</div>
  </div>
</header>

<!-- EDITIONS -->
<main id="ed-hero" class="wrap">
  <section class="hero">
    <div class="eyebrow">The Horizon Scan</div>
    <h1 id="hero-h1">Design, AI &amp; society, decoded every morning.</h1>
    <p>Build your own collections while you read.<br>Group signals by theme, project or trend.</p>
  </section>
</main>
<div id="ed-filter" class="filterbar">
  <div class="wrap inner">
    <input id="search" class="search" type="text" placeholder="Search all stories..." oninput="render()" />
    <div id="chips" class="chips"></div>
  </div>
</div>
<main id="feed" class="wrap"></main>

<!-- BOARDS -->
<main id="boards" class="wrap" style="display:none;"></main>

<!-- BOARD DETAIL -->
<main id="boarddetail" class="wrap" style="display:none;"></main>

<!-- ALL SIGNALS -->
<main id="allsig" class="wrap" style="display:none;"></main>

<footer class="site">
  <div class="wrap site-foot">
    <div class="copy">Copyright &copy; Dell Inc. All Rights Reserved.</div>
    <div class="conf">Internal Use Confidential</div>
    <div class="logos">
      <img class="dell-img" src="dell-logo.png" alt="Dell Technologies" />
      <img class="eldorado-img" src="eldorado-neg.png" alt="Eldorado — Inspiração pelo Novo" />
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script>
  /* ---------------- shared setup ---------------- */
  var EDITIONS = (window.EDITIONS || []).slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  var IMG_ERR = "this.onerror=null;this.style.display='none';";
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function attr(s){return String(s==null?"":s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

  var STEEP={
    social:{label:"Social",color:"#E4572E"},
    technological:{label:"Technological",color:"#2E2BFF"},
    economic:{label:"Economic",color:"#E0A100"},
    environmental:{label:"Environmental",color:"#128A4B"},
    political:{label:"Political",color:"#7B2FF7"}
  };
  function classifySteep(m){
    var s=((m.section||"")+"").toLowerCase();
    var t=((m.headline||"")+" "+(m.body||"")).toLowerCase();
    function h(str,arr){for(var i=0;i<arr.length;i++){if(str.indexOf(arr[i])>-1)return true;}return false;}
    if(h(s,["environment","climate","energy","sustainab"])||h(t,["climate","geotherm","wetland","emission","carbon","renewable"," grid","solar","krill","ocean","water","biodivers","pollut"]))return "environmental";
    if(h(s,["business","investment","market","econom"])||h(t,["ipo","funding","raise","raising","billion","valuation","bond","stock","revenue","layoff","invest","earnings","acquire","acquisit"]))return "economic";
    if(h(s,["politic","governance","geopolit","policy"])||h(t,["government","regulat"," ban ","banned","senator","senate","lawsuit","court","tariff","sanction","minister","indict","congress","white house","election"]))return "political";
    if(h(s,["design","product","technolog","gadget"," ai",":ai","authorship"])||h(t,["robot","chip","model","app ","gadget","device","3d print","printing","glasses","wearable","software","printer","launch"]))return "technological";
    return "social";
  }

  var STORIES=[], STORY_BY_KEY={};
  function storyKey(s){return s.url||(s.edId+"::"+s.headline);}
  EDITIONS.forEach(function(ed){
    (ed.sections||[]).forEach(function(sec){
      (sec.items||[]).forEach(function(it){
        var s={edId:ed.id,tag:ed.tag,displayDate:ed.displayDate,edition:ed.edition,
          heading:sec.heading,headline:it.headline,body:it.body,source:it.source,url:it.url,image:it.image,
          steep:classifySteep({section:sec.heading,headline:it.headline,body:it.body})};
        s.key=storyKey(s);
        STORIES.push(s); STORY_BY_KEY[s.key]=s;
      });
    });
  });

  /* ---------------- storage (per-browser) ---------------- */
  var PB="wlab_boards", PS="wlab_signals";
  function readJSON(k){try{var a=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
  function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function getBoards(){return readJSON(PB);}
  function setBoards(a){writeJSON(PB,a);updateCounts();}
  function getSaved(){return readJSON(PS);}
  function setSaved(a){writeJSON(PS,a);updateCounts();}

  function metaFor(key){
    var m=STORY_BY_KEY[key];
    if(!m){var saved=getSaved();for(var i=0;i<saved.length;i++){if(saved[i].key===key)return saved[i];}return null;}
    return {key:key,headline:m.headline,body:m.body,source:m.source,url:m.url,image:m.image,
      editionTag:m.tag,editionDate:m.displayDate,editionId:m.edId,section:m.heading,steep:m.steep};
  }
  function isSaved(key){return getSaved().some(function(s){return s.key===key;});}
  function ensureSaved(key){
    var saved=getSaved();
    if(!saved.some(function(s){return s.key===key;})){var m=metaFor(key);if(m){m.savedAt=Date.now();saved.push(m);setSaved(saved);}}
  }
  function boardsForKey(key){return getBoards().filter(function(b){return b.keys.indexOf(key)>-1;});}
  function newId(){return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  function createBoard(name,desc){
    var boards=getBoards();

  }
  function updateBoard(id,patch){
    var boards=getBoards();

    setBoards(boards);
  }
  function deleteBoard(id){setBoards(getBoards().filter(function(b){return b.id!==id;}));}
  function toggleKeyInBoard(id,key){
    ensureSaved(key);
    var boards=getBoards();
    for(var i=0;i<boards.length;i++){
      if(boards[i].id===id){
        var idx=boards[i].keys.indexOf(key);
        if(idx>-1){boards[i].keys.splice(idx,1);}
        else{boards[i].keys.push(key); if(!boards[i].cover){var m=metaFor(key); if(m&&m.image)boards[i].cover=m.image;}}
      }
    }
    setBoards(boards);
  }
  function removeFromBoard(id,key){
    var boards=getBoards();
    for(var i=0;i<boards.length;i++){if(boards[i].id===id){var idx=boards[i].keys.indexOf(key);if(idx>-1)boards[i].keys.splice(idx,1);}}

  }
  function deleteSignal(key){

  }

  function balanceCards(){
    var cards=document.querySelectorAll(".fcard");

      var h=cards[i].querySelector("h4"),b=cards[i].querySelector(".body");
      if(!h||!b||h.offsetHeight===0)continue;
      var tlh=parseFloat(getComputedStyle(h).lineHeight)||24;
      var tLines=Math.max(1,Math.min(4,Math.round(h.offsetHeight/tlh)));
      var bl=9-tLines; if(bl<4)bl=4; if(bl>7)bl=7;
      b.style.webkitLineClamp=bl; b.style.lineClamp=bl;
    }
  }

  /* ---------------- Save-to-board popover ---------------- */
  var pickerEl=null, pickerKey=null, pickerQ="";
  function closePicker(){if(pickerEl){pickerEl.remove();pickerEl=null;pickerKey=null;pickerQ="";document.removeEventListener("mousedown",onDocDown,true);document.removeEventListener("keydown",onPickKey,true);}}
  function onDocDown(e){if(pickerEl&&!pickerEl.contains(e.target))closePicker();}

  /* ---- Download a signal as a shareable JPEG (STEEP-coded card) ---- */
  function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function wrapLines(ctx,text,maxW){
    var words=String(text||"").split(/\s+/),lines=[],cur="";
    for(var i=0;i<words.length;i++){
      var test=cur?cur+" "+words[i]:words[i];
      if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=words[i];}else{cur=test;}
    }
    if(cur)lines.push(cur);
    return lines;
  }
  function wrapChars(ctx,text,maxW,maxLines){
    text=String(text||"");var lines=[],cur="";
    for(var i=0;i<text.length;i++){
      var test=cur+text[i];
      if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=text[i];if(maxLines&&lines.length>=maxLines)break;}
      else{cur=test;}
    }
    if(cur&&(!maxLines||lines.length<maxLines))lines.push(cur);
    if(maxLines&&lines.length>=maxLines){
      var last=lines[maxLines-1];
      while(last.length&&ctx.measureText(last+"…").width>maxW){last=last.slice(0,-1);}
      lines[maxLines-1]=last+"…";
      lines=lines.slice(0,maxLines);
    }
    return lines;
  }
  function downloadSignal(ev,key){
    if(ev){ev.stopPropagation();}
    var arr=getSaved(), it=null;
    for(var i=0;i<arr.length;i++){if(arr[i].key===key){it=arr[i];break;}}
    if(!it)it=metaFor(key);
    if(!it)return;
    var cat=it.steep||classifySteep(it), st=STEEP[cat]||STEEP.social;
    var slug=(it.headline||"signal").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50)||"signal";

    function draw(logo){
      var W=1600,H=1040,dpr=2;
      var c=document.createElement("canvas");
      c.width=W*dpr;c.height=H*dpr;
      var ctx=c.getContext("2d");ctx.scale(dpr,dpr);
      var INK="#0B0B0B",MUT="#6B7280",PANEL="#F5F5F7";
      var SANS='"Inter",Arial,sans-serif',MONO='"Space Mono",monospace';
      var m=96, cw=W-2*m;

      ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
      ctx.fillStyle=st.color;ctx.fillRect(0,0,W,16);

      ctx.fillStyle=INK;ctx.textBaseline="top";
      ctx.font="800 46px "+SANS;
      var tLines=wrapLines(ctx,it.headline||"",cw), ty=132, tlh=56;
      for(var i2=0;i2<tLines.length;i2++){ctx.fillText(tLines[i2],m,ty+i2*tlh);}
      var afterTitle=ty+tLines.length*tlh+26;

      ctx.font="700 20px "+MONO;
      var label=st.label.toUpperCase(), tw=ctx.measureText(label).width, pw=tw+40, ph=46;
      ctx.fillStyle=st.color;rr(ctx,m,afterTitle,pw,ph,6);ctx.fill();
      ctx.fillStyle=(cat==="economic")?INK:"#FFFFFF";
      ctx.fillText(label,m+20,afterTitle+13);
      ctx.font="400 20px "+MONO;ctx.fillStyle=MUT;
      ctx.fillText(((it.editionTag?it.editionTag+"  ·  ":"")+(it.editionDate||"")).toUpperCase(),m+pw+24,afterTitle+13);

      var pTop=afterTitle+ph+48, pBottom=H-150, gap=26;
      var leftW=Math.round(cw*0.6), rightW=cw-leftW-gap, leftX=m, rightX=m+leftW+gap;
      var pad=40;

      function panel(x,y,w,h){ctx.fillStyle=PANEL;rr(ctx,x,y,w,h,16);ctx.fill();}
      function plabel(txt,x,y){ctx.font="800 24px "+SANS;ctx.fillStyle=INK;ctx.fillText(txt,x,y);}

      panel(leftX,pTop,leftW,pBottom-pTop);
      plabel("Summary",leftX+pad,pTop+pad);
      ctx.font="400 27px "+SANS;ctx.fillStyle="#3A3A3A";
      var body=String(it.body||"");if(body.length>520)body=body.slice(0,520).replace(/\s+\S*$/,"")+"…";
      var bLines=wrapLines(ctx,body,leftW-2*pad), by=pTop+pad+46, blh=39;
      for(var j=0;j<bLines.length;j++){ctx.fillText(bLines[j],leftX+pad,by+j*blh);}

      var rH=(pBottom-pTop-gap)/2;
      panel(rightX,pTop,rightW,rH);
      plabel("Source",rightX+pad,pTop+pad);
      ctx.font="400 25px "+SANS;ctx.fillStyle="#3A3A3A";
      var srcTxt=(it.source||"Source");
      var sLines=wrapLines(ctx,srcTxt,rightW-2*pad);
      for(var s2=0;s2<sLines.length;s2++){ctx.fillText(sLines[s2],rightX+pad,pTop+pad+46+s2*36);}
      if(it.url){ctx.font="400 18px "+MONO;ctx.fillStyle=MUT;
        var uLines=wrapChars(ctx,it.url,rightW-2*pad,3);
        var uy=pTop+pad+46+sLines.length*36+14;
        for(var u2=0;u2<uLines.length;u2++){ctx.fillText(uLines[u2],rightX+pad,uy+u2*26);}
      }

      var catY=pTop+rH+gap;
      panel(rightX,catY,rightW,rH);
      plabel("STEEP category",rightX+pad,catY+pad);
      ctx.fillStyle=st.color;rr(ctx,rightX+pad,catY+pad+50,26,26,4);ctx.fill();
      ctx.font="700 26px "+SANS;ctx.fillStyle=INK;
      ctx.fillText(st.label,rightX+pad+40,catY+pad+51);

      if(logo){var lw=190,lh=logo.height*(lw/logo.width);ctx.drawImage(logo,W-m-lw,H-70-lh/2+10,lw,lh);}
      else{ctx.font="800 22px "+SANS;ctx.fillStyle=INK;ctx.textAlign="right";ctx.fillText("WORKABILITY LAB",W-m,H-92);ctx.textAlign="left";}

      c.toBlob(function(blob){
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");a.href=url;a.download="signal-"+slug+".jpg";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
      },"image/jpeg",0.95);
    }

    function go(){
      var img=new Image();
      img.onload=function(){draw(img);};
      img.onerror=function(){draw(null);};
      img.src="workability-logo.png";
    }
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);}else{go();}
  }

  /* ---------------- Board create/edit modal ---------------- */
  var modalEl=null, modalCover=null;
  function openBoardModal(id){
    var b=id?boardById(id):null;
    modalCover=b?b.cover:null;
    var covers=[];
    if(b){b.keys.map(metaFor).filter(Boolean).forEach(function(m){if(m.image&&covers.indexOf(m.image)===-1)covers.push(m.image);});}
    var coverGrid = b && covers.length
      ? '<label>Cover image</label><div class="cover-pick" id="cover-pick">'+
          '<div class="cover-none'+(!modalCover?" sel":"")+'" onclick="setModalCover(null)">None</div>'+
          covers.map(function(u){return '<img class="cover-opt'+(modalCover===u?" sel":"")+'" src="'+attr(u)+'" onclick="setModalCover(\''+attr(u)+'\')" onerror="'+IMG_ERR+'">';}).join("")+
        '</div>'
      : (b?'<label>Cover image</label><p class="page-sub" style="margin-bottom:18px">Add signals with images to pick a cover.</p>':'');
    modalEl=document.createElement("div");
    modalEl.className="modal-backdrop";
    modalEl.onmousedown=function(e){if(e.target===modalEl)closeModal();};
    modalEl.innerHTML='<div class="modal"><h3>'+(b?"Edit board":"New board")+'</h3>'+
      '<label>Name</label><input type="text" id="m-name" value="'+attr(b?b.name:"")+'" placeholder="e.g. AI &amp; work" maxlength="60">'+
      '<label>Description</label><textarea id="m-desc" placeholder="What is this board about? (optional)" maxlength="240">'+esc(b?b.description:"")+'</textarea>'+
      coverGrid+
      '<div class="modal-actions">'+
        (b?'<button class="btn ghost danger" onclick="confirmDeleteBoard(\''+b.id+'\');closeModal()">Delete</button>':'')+
        '<div class="spacer"></div>'+
        '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+
        '<button class="btn" onclick="saveBoardModal('+(b?"'"+b.id+"'":"null")+')">'+(b?"Save":"Create")+'</button>'+
      '</div></div>';
    document.body.appendChild(modalEl);
    document.addEventListener("keydown",onModalKey,true);
    var ni=document.getElementById("m-name"); if(ni)ni.focus();
  }
  function onModalKey(e){if(e.key==="Escape")closeModal();}
  function setModalCover(u){modalCover=u;var g=document.getElementById("cover-pick");if(!g)return;
    Array.prototype.forEach.call(g.children,function(c){c.classList.remove("sel");});
    if(u===null){g.querySelector(".cover-none").classList.add("sel");}
    else{Array.prototype.forEach.call(g.querySelectorAll(".cover-opt"),function(img){if(img.getAttribute("src")===u)img.classList.add("sel");});}
  }
  function saveBoardModal(id){
    var name=(document.getElementById("m-name").value||"").trim();
    var desc=(document.getElementById("m-desc").value||"").trim();
    if(!name){document.getElementById("m-name").focus();return;}
    if(id){updateBoard(id,{name:name,description:desc,cover:modalCover});}
    else{createBoard(name,desc);}
    closeModal();
    if(getCurrentView()==="boarddetail")renderBoardDetail();
    renderBoards();
  }
  function closeModal(){if(modalEl){modalEl.remove();modalEl=null;document.removeEventListener("keydown",onModalKey,true);}}

  /* ---------------- view routing ---------------- */
  var VIEW="ed";
  function getCurrentView(){return VIEW;}
  function showView(v){
    VIEW=v; closePicker();
    var edOn=v==="ed";
    document.getElementById("ed-hero").style.display=edOn?"":"none";
    document.getElementById("ed-filter").style.display=edOn?"":"none";
    document.getElementById("feed").style.display=edOn?"":"none";
    document.getElementById("boards").style.display=v==="boards"?"":"none";
    document.getElementById("boarddetail").style.display=v==="boarddetail"?"":"none";
    document.getElementById("allsig").style.display=v==="allsig"?"":"none";
    document.getElementById("nav-ed").classList.toggle("active",edOn);
    document.getElementById("nav-boards").classList.toggle("active",v==="boards"||v==="boarddetail");
    document.getElementById("nav-allsig").classList.toggle("active",v==="allsig");
    if(v==="boards")renderBoards();
    if(v==="boarddetail")renderBoardDetail();
    if(v==="allsig")renderAllSig();
    if(edOn)render();
    window.scrollTo(0,0);
  }
  function updateCounts(){
    var nb=getBoards().length, ns=getSaved().length;
    document.getElementById("boards-count").textContent=nb?("("+nb+")"):"";
    document.getElementById("allsig-count").textContent=ns?("("+ns+")"):"";
  }

  /* ---------------- rotating hero headline (one per day) ---------------- */
  var HEADLINES=[
    ["The future,","before it's obvious."],
    ["Today's signals,","tomorrow's impact."],
    ["See the shift","before everyone else."],
    ["Where the future","leaks first."],
    ["Catch the trend","while it's still a whisper."],
    ["The patterns behind","the headlines."],
    ["Spot what's coming.","Act before it lands."],
    ["The world is changing.","Here's the early draft."],
    ["Small signals,","big shifts."],
    ["What's fringe today","is default tomorrow."],
    ["The trends before","they trend."],
    ["Weak signals,","strong futures."],
    ["Change shows up","small first."],
    ["Read the edges,","not the headlines."],
    ["Find the signal","in the noise."],
    ["What everyone","will notice later."],
    ["The dots","before they connect."],
    ["See it coming","while it's still small."],
    ["Tomorrow starts","as a rumor."],
    ["The quiet signals","that get loud."]
  ];
  function setHeadline(){
    var el=document.getElementById("hero-h1"); if(!el)return;
    var dayIndex=Math.floor(Date.now()/86400000);
    var h=HEADLINES[((dayIndex%HEADLINES.length)+HEADLINES.length)%HEADLINES.length];
    el.innerHTML=esc(h[0])+'<br>'+esc(h[1]);
  }
  setHeadline();

  /* ---------------- init ---------------- */
  renderChips();
  updateCounts();
  render();
</script>
</body>
</html>
